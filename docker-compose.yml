version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_pass_change_me
      POSTGRES_DB: synapse_chamber
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://synapse:synapse_pass_change_me@postgres:5432/synapse_chamber
      SESSION_SECRET: change-this-secret-key-in-production
      FLASK_ENV: production
      AGENT_MAX_STEPS: 6
      MEMORY_USE_DATABASE: "true"
    volumes:
      - ./data:/app/data
      - ./static/screenshots:/app/static/screenshots
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
